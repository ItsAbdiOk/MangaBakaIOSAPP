# Source of truth for the Xcode project. Regenerate with `xcodegen generate`
# after adding or moving files. The generated .xcodeproj is committed so that
# Xcode Cloud and contributors without XcodeGen can build without extra setup.
name: MangaBaka
options:
  bundleIdPrefix: dev.abdirahmanmohamed
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Sets LastUpgradeCheck, which is what silences Xcode's "Update to
  # recommended settings" prompt. Kept here rather than in the generated
  # project, where regeneration would discard it.
  xcodeVersion: "2660"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Xcode recommended setting: generates type-safe Swift symbols for strings
    # in String Catalogs, so a renamed or missing key fails to compile instead
    # of falling back to the raw key at runtime.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Warnings are errors. A Swift warning caught a real crash here — an
    # infinitely recursive subscript that killed the test process with a stack
    # overflow — and it went unnoticed for hours because the build output was
    # only ever grepped for "error:". There is no legacy code to grandfather,
    # so the cheapest fix is to stop allowing warnings at all.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  MangaBaka:
    type: application
    platform: iOS
    sources:
      - path: MangaBaka
    dependencies:
      - package: GRDB
        product: GRDB
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    # A real Info.plist rather than a generated one, because the app reads two
    # build settings at runtime and INFOPLIST_KEY_* only supports Apple's own
    # known keys — custom names are silently dropped, which is why MB_PAT never
    # reached the app.
    #
    # MB_PAT resolves to empty in any build without a local
    # Configs/Secrets.xcconfig, which includes every Xcode Cloud build, so a
    # TestFlight or App Store build can never carry a token.
    info:
      path: Configs/Info.plist
      properties:
        CFBundleDisplayName: MangaBaka
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Standard HTTPS only, which is exempt. Without this, App Store Connect
        # asks an encryption question on EVERY build and stalls an unattended
        # TestFlight pipeline until a human answers it.
        ITSAppUsesNonExemptEncryption: false
        MB_PAT: $(MB_PAT)
        MB_API_BASE_URL: $(MB_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka
        PRODUCT_NAME: MangaBaka
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Team "Abdirahman Mohamed". Set here so Xcode and Xcode Cloud resolve
        # signing without anyone picking it from a dropdown by hand.
        DEVELOPMENT_TEAM: 5AF2LBU5A3

  MangaBakaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MangaBakaTests
    dependencies:
      - target: MangaBaka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MangaBaka:
    build:
      targets:
        MangaBaka: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MangaBakaTests
    archive:
      config: Release
