# Source of truth for the Xcode project. Regenerate with `xcodegen generate`
# after adding or moving files. The generated .xcodeproj is committed so that
# Xcode Cloud and contributors without XcodeGen can build without extra setup.
name: MangaBaka
options:
  bundleIdPrefix: dev.abdirahmanmohamed
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Sets LastUpgradeCheck, which is what silences Xcode's "Update to
  # recommended settings" prompt. Kept here rather than in the generated
  # project, where regeneration would discard it.
  xcodeVersion: "2660"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Xcode recommended setting: generates type-safe Swift symbols for strings
    # in String Catalogs, so a renamed or missing key fails to compile instead
    # of falling back to the raw key at runtime.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Warnings are errors. A Swift warning caught a real crash here — an
    # infinitely recursive subscript that killed the test process with a stack
    # overflow — and it went unnoticed for hours because the build output was
    # only ever grepped for "error:". There is no legacy code to grandfather,
    # so the cheapest fix is to stop allowing warnings at all.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  MangaBaka:
    type: application
    platform: iOS
    sources:
      - path: MangaBaka
    dependencies:
      - package: GRDB
        product: GRDB
      # Embedded so the widget extension ships inside the app bundle rather
      # than as a separate install.
      - target: MangaBakaWidgets
        embed: true
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    # A real Info.plist rather than a generated one, because the app reads two
    # build settings at runtime and INFOPLIST_KEY_* only supports Apple's own
    # known keys — custom names are silently dropped, which is why MB_PAT never
    # reached the app.
    #
    # MB_PAT resolves to empty in any build without a local
    # Configs/Secrets.xcconfig, which includes every Xcode Cloud build, so a
    # TestFlight or App Store build can never carry a token.
    info:
      path: Configs/Info.plist
      properties:
        CFBundleDisplayName: MangaBaka
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Standard HTTPS only, which is exempt. Without this, App Store Connect
        # asks an encryption question on EVERY build and stalls an unattended
        # TestFlight pipeline until a human answers it.
        ITSAppUsesNonExemptEncryption: false
        # The widgets deep-link into a series with mangabaka://series/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: dev.abdirahmanmohamed.mangabaka
            CFBundleURLSchemes: [mangabaka]
        MB_PAT: $(MB_PAT)
        MB_API_BASE_URL: $(MB_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka
        PRODUCT_NAME: MangaBaka
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Team "Abdirahman Mohamed". Set here so Xcode and Xcode Cloud resolve
        # signing without anyone picking it from a dropdown by hand.
        DEVELOPMENT_TEAM: 5AF2LBU5A3
        # The App Group `WidgetSnapshot` writes into and `MangaBakaWidgets`
        # reads from. Automatic signing adds the App Groups capability to a
        # local build's profile on its own; Xcode Cloud does not have that
        # same door — if its first archive fails on entitlements, enable
        # "App Groups" for this App ID in the developer portal by hand.
        CODE_SIGN_ENTITLEMENTS: Configs/MangaBaka.entitlements

  # Home Screen widgets: "Due this week" and "Pick back up". Reads
  # `WidgetSnapshot`'s JSON out of the App Group container the app writes
  # into after a library walk and a schedule build — this target has no
  # access to the app's own sandboxed container, database, or `URLCache`.
  MangaBakaWidgets:
    type: app-extension
    platform: iOS
    # iOS 26 like the app; XcodeGen's app-extension default otherwise picks
    # the SDK floor, where WidgetKit's SwiftUI APIs are missing.
    deploymentTarget: "26.0"
    sources:
      - path: MangaBakaWidgets
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Configs/MangaBakaWidgetsInfo.plist
      properties:
        CFBundleDisplayName: MangaBaka Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka.widgets
        PRODUCT_NAME: MangaBakaWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5AF2LBU5A3
        CODE_SIGN_ENTITLEMENTS: Configs/MangaBakaWidgets.entitlements

  MangaBakaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MangaBakaTests
      # The widget extension's own decoder, compiled into this test target so
      # `WidgetSnapshotTests` can decode the app's bytes with the type the
      # widget really uses. Until 2026-09-14 that test round-tripped
      # `WidgetSnapshot` through `WidgetSnapshot`, so renaming a field on one
      # side only still passed — and `WidgetSnapshotData`'s list properties
      # default to `[]`, so the widget would have decoded cleanly and drawn
      # "Open MangaBaka to load" forever. One file, not the whole target: the
      # rest of `MangaBakaWidgets` is WidgetKit views this bundle cannot host.
      - path: MangaBakaWidgets/WidgetSnapshotData.swift
    dependencies:
      - target: MangaBaka
      # `DetailCacheDiscardTests` drops a table out from under the repository
      # to make a discard fail the way a full disk makes it fail, which needs
      # GRDB's own symbols in the test module rather than only the app's.
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka.tests
        GENERATE_INFOPLIST_FILE: YES

  # Deliberately NOT in the scheme's test action. These measure rather than
  # assert: they are slow, they are noisy on a contended machine, and a build
  # that fails because a laptop was busy teaches people to ignore failures.
  # Run them on purpose:
  #   xcodebuild test -scheme MangaBaka -only-testing:MangaBakaPerformanceTests
  MangaBakaPerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MangaBakaPerformanceTests
    dependencies:
      - target: MangaBaka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka.performance
        GENERATE_INFOPLIST_FILE: YES

  # Apple's automated accessibility audit. Out of the scheme's test action for
  # the same reason as the performance tests: it launches a real app per test
  # and is slow. Run it on purpose:
  #   xcodebuild test -scheme MangaBaka -only-testing:MangaBakaUITests
  MangaBakaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MangaBakaUITests
    dependencies:
      - target: MangaBaka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MangaBaka:
    build:
      targets:
        MangaBaka: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MangaBakaTests
    archive:
      config: Release

  # Its own scheme rather than a skipped entry in the main one, so it cannot be
  # run by accident and cannot slow a push. Measuring is a thing you choose to
  # do; asserting is a thing that happens to you.
  #
  #   xcodebuild test -scheme MangaBakaPerformance -destination '<a simulator>'
  MangaBakaPerformance:
    build:
      targets:
        MangaBaka: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MangaBakaPerformanceTests

  # Same reasoning as MangaBakaPerformance: its own scheme, so an audit that
  # launches the app a dozen times can never be run by accident or slow a push.
  #
  #   xcodebuild test -scheme MangaBakaAccessibility -destination '<a simulator>'
  MangaBakaAccessibility:
    build:
      targets:
        MangaBaka: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MangaBakaUITests
