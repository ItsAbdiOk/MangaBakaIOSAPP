# Source of truth for the Xcode project. Regenerate with `xcodegen generate`
# after adding or moving files. The generated .xcodeproj is committed so that
# Xcode Cloud and contributors without XcodeGen can build without extra setup.
name: MangaBaka
options:
  bundleIdPrefix: dev.abdirahmanmohamed
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # Sets LastUpgradeCheck, which is what silences Xcode's "Update to
  # recommended settings" prompt. Kept here rather than in the generated
  # project, where regeneration would discard it.
  xcodeVersion: "2660"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Xcode recommended setting: generates type-safe Swift symbols for strings
    # in String Catalogs, so a renamed or missing key fails to compile instead
    # of falling back to the raw key at runtime.
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Treat warnings seriously; this project has no legacy code to grandfather.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  MangaBaka:
    type: application
    platform: iOS
    sources:
      - path: MangaBaka
    dependencies:
      - package: GRDB
        product: GRDB
    configFiles:
      Debug: Configs/Base.xcconfig
      Release: Configs/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka
        PRODUCT_NAME: MangaBaka
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: MangaBaka
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Declares that the app uses only standard HTTPS, which is exempt from
        # export compliance. Without this, App Store Connect asks an encryption
        # question on EVERY build, which would block an unattended TestFlight
        # pipeline until someone answered it by hand.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        # Team "Abdirahman Mohamed". Set here so Xcode and Xcode Cloud resolve
        # signing without anyone picking it from a dropdown by hand.
        DEVELOPMENT_TEAM: 5AF2LBU5A3

  MangaBakaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MangaBakaTests
    dependencies:
      - target: MangaBaka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abdirahmanmohamed.mangabaka.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MangaBaka:
    build:
      targets:
        MangaBaka: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MangaBakaTests
    archive:
      config: Release
