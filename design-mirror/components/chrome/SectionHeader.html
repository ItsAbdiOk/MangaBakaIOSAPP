<!-- @dsCard group="Chrome" -->
<meta charset="utf-8">
<!-- Mirrors MangaBaka/Features/Shared/SectionHeader.swift (title + optional
     trailing action, HStack.firstTextBaseline) and DetailHero/DetailStatsStrip's
     neighbour, the detail section heading (typeDetailSectionHeader, no action). -->
<link rel="stylesheet" href="../../styles.css">
<style>
  .header { display: flex; align-items: baseline; padding: 0 var(--gutter); }
  .spacer { flex: 1; min-width: var(--gap-strip); }
  .title { color: var(--text-primary); margin: 0; }
  .action { color: var(--accent); background: none; border: none; padding: 0; font: inherit; cursor: pointer; }
  .detail-title { color: var(--text-primary); margin: 0; padding: 0 var(--gutter); }
</style>

<p class="ds-label type-footnote">SectionHeader — title only</p>
<div class="ds-card">
  <div class="header"><p class="type-section-header title">In progress</p><div class="spacer"></div></div>
</div>

<p class="ds-label type-footnote">SectionHeader — with a trailing action (typeChip, accent)</p>
<div class="ds-card">
  <div class="header">
    <p class="type-section-header title">Recently viewed</p>
    <div class="spacer"></div>
    <button class="type-chip action">See all</button>
  </div>
</div>

<p class="ds-label type-footnote">Detail section header — typeDetailSectionHeader(), no trailing action (e.g. "Synopsis", "Related series")</p>
<div class="ds-card">
  <p class="type-detail-section detail-title">Synopsis</p>
</div>
