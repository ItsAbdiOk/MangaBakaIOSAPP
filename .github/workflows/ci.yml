name: CI

# Every push and PR. The point of this workflow is that anything broken breaks
# here, loudly, rather than in a TestFlight build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run; no point burning macOS minutes on
  # a commit that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        # Discovered rather than hard-coded: pinning a path breaks silently
        # whenever GitHub updates the runner image.
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -switch "$newest"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify

      - name: Lint
        # Fails on any error-severity rule: force unwraps, hard-coded tokens,
        # print(), catch-all error handling.
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Check the Xcode project is in sync with project.yml
        # project.yml is the source of truth; the .xcodeproj is committed so
        # Xcode Cloud and contributors work without XcodeGen. Regeneration is
        # byte-deterministic, so drift means someone edited the wrong file.
        run: |
          xcodegen generate
          if ! git diff --quiet -- MangaBaka.xcodeproj; then
            echo "::error::MangaBaka.xcodeproj is out of sync with project.yml."
            echo "Run 'xcodegen generate' and commit the result."
            git diff --stat -- MangaBaka.xcodeproj
            exit 1
          fi

      - name: Guard against a committed token
        # Belt and braces alongside the lint rule: a real PAT must never reach
        # the repository or a build, because anyone with the binary could use it.
        run: |
          if [ -f Configs/Secrets.xcconfig ]; then
            echo "::error::Configs/Secrets.xcconfig is committed. It must stay local."
            exit 1
          fi
          if git grep -nE '"mb-[A-Za-z0-9]{16,}"' -- 'MangaBaka/*.swift'; then
            echo "::error::A token-shaped literal is present in shipping code."
            exit 1
          fi

      - name: Pick an available iPhone simulator
        id: sim
        # Also discovered rather than hard-coded, for the same reason.
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+ Pro' | sort -V | tail -1)
          if [ -z "$name" ]; then
            name=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]*' \
              | head -1 | sed 's/[[:space:]]*$//')
          fi
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MangaBaka.xcodeproj \
            -scheme MangaBaka \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
