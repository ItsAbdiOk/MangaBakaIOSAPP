# Lint rules for MangaBaka.
#
# The custom rules at the bottom enforce the project standards in CLAUDE.md
# that SwiftLint has no built-in equivalent for. They are errors, not warnings:
# the point of this file is that violations break the build rather than
# accumulating quietly.

included:
  - MangaBaka
  - MangaBakaTests

excluded:
  - MangaBaka.xcodeproj
  - .build

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - yoda_condition

analyzer_rules:
  - unused_import

# CLAUDE.md: "No force-unwraps reachable from real input." Anything the network
# or a user can influence must not be force-unwrapped. Enforced as an error.
force_unwrapping:
  severity: error
force_cast:
  severity: error
force_try:
  severity: error
implicitly_unwrapped_optional:
  severity: error

line_length:
  warning: 110
  error: 140
  ignores_comments: false
  ignores_urls: true

type_body_length:
  warning: 250
  error: 400
function_body_length:
  warning: 60
  error: 100
file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded: [id, x, y]

nesting:
  type_level: 2

custom_rules:
  no_catch_all_error_handling:
    name: "Catch-all error handling"
    # CLAUDE.md / design doc: "Errors are named, not swallowed." A bare
    # `catch {` that only produces a generic message hides real failures.
    regex: '\}\s*catch\s*\{\s*\n\s*(return|self\.state\s*=)?\s*.*(Something went wrong|unknown error|generic)'
    message: "Name the error case instead of swallowing it into a generic message."
    severity: error

  no_print_statements:
    name: "print() in shipping code"
    regex: '(?<!\/\/\s)\bprint\('
    match_kinds: [identifier]
    message: "Use a logger, not print(). print() is invisible in a TestFlight build."
    severity: error

  no_hardcoded_token:
    name: "Hard-coded MangaBaka token"
    # A PAT in source would grant account access to anyone with the binary.
    # Tests are exempt: they need literal token-shaped strings to prove the
    # provider accepts and rejects the right things. The rule stays an error
    # for all shipping code, which is where it matters.
    regex: '"mb-[A-Za-z0-9]{8,}"'
    excluded: ".*Tests?\\.swift"
    message: "Never hard-code a personal access token. Use Secrets.xcconfig."
    severity: error

  no_todo_without_owner:
    name: "Bare TODO"
    regex: '(TODO|FIXME)(?!\s*\(\w)'
    message: "TODO/FIXME must name an issue or owner, e.g. TODO(#12): ..."
    severity: warning

reporter: "xcode"
