  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>MangaBaka — design prompts 01–06<\u002Ftitle>\n<style>\nhtml,body{margin:0;padding:0;background:#0a0a0c}\n*{box-sizing:border-box;-webkit-font-smoothing:antialiased}\na{color:#F87966;text-decoration:none}\na:hover{color:#ffa189}\n@keyframes bmpulse{0%,100%{opacity:1}50%{opacity:0.3}}\n@keyframes bmshimmer{0%{opacity:0.35}50%{opacity:0.7}100%{opacity:0.35}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div style=\"padding:44px 44px 0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c\">\n  <div style=\"max-width:820px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">MANGABAKA · DESIGN PROMPTS 01–06<\u002Fdiv>\n    <div style=\"font-size:46px;font-weight:700;letter-spacing:-1.8px;line-height:1.02;color:rgba(255,255,255,0.98)\">Six screens the app has and never designed<\u002Fdiv>\n    <div style=\"font-size:15px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">One board per brief, in order: Settings, states, first run, Library, lenses and the tag filter, app icon. Each board carries its frames first and its decisions last — the notes panels are where anything arguable is named, including what still needs a call from you.<\u002Fdiv>\n    <div style=\"margin-top:6px;display:flex;gap:9px;flex-wrap:wrap\">\n      <a href=\"#brief-01\" style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;white-space:nowrap;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">01 Settings<\u002Fa>\n      <a href=\"#brief-02\" style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;white-space:nowrap;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">02 States<\u002Fa>\n      <a href=\"#brief-03\" style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;white-space:nowrap;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">03 First run<\u002Fa>\n      <a href=\"#brief-04\" style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;white-space:nowrap;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">04 Library<\u002Fa>\n      <a href=\"#brief-05\" style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;white-space:nowrap;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">05 Lenses<\u002Fa>\n      <a href=\"#brief-06\" style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;white-space:nowrap;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">06 App icon<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"brief-01\" style=\"scroll-margin-top:20px\"><\u002Fdiv>\n<section style=\"padding:44px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c;display:flex;flex-direction:column;gap:40px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:760px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">BRIEF 01 · SETTINGS<\u002Fdiv>\n    <div style=\"font-size:38px;font-weight:700;letter-spacing:-1.3px;line-height:1.05;color:rgba(255,255,255,0.98)\">Settings, all six sections<\u002Fdiv>\n    <div style=\"font-size:14.5px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">Reached by the gear in the Library header — it has no tab. Every section in its resting state, then the four account states, an empty blocked list, an empty history, and one row at the largest accessibility size. Switches are drawn, per the constraint.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">A<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Resting state, whole page<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.58);text-wrap:pretty\">Unrolled to full height rather than scrolled, so the section rhythm is reviewable. 96pt is reserved at the foot for the tab bar.<\u002Fdiv>\n\n      <div style=\"position:relative;width:393px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n\n        <div style=\"position:relative;height:96px;display:flex;align-items:flex-end;padding:0 18px 10px\">\n          <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff\">11:34<\u002Fdiv>\n          <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;width:100%\">\n            <div style=\"width:38px;height:38px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;flex:none\">\n              <svg width=\"9\" height=\"15\" viewBox=\"0 0 9 15\" fill=\"none\"><path d=\"M7 1.5 1.8 7.5 7 13.5\" stroke=\"rgba(255,255,255,0.9)\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.3px;color:rgba(255,255,255,0.96)\">Settings<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:14px 18px 96px;display:flex;flex-direction:column;gap:30px\">\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">ACCOUNT<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">The app works without one. A token adds library sync, personal recommendations and your taste profile.<\u002Fdiv>\n            <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);overflow:hidden\">\n              <div style=\"padding:14px;display:flex;flex-direction:column;gap:11px\">\n                <div style=\"display:flex;align-items:center;gap:9px\">\n                  <span style=\"width:8px;height:8px;border-radius:999px;background:oklch(0.72 0.16 145);flex:none\"><\u002Fspan>\n                  <span style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.95)\">Connected<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:14px;color:rgba(235,235,245,0.5)\">@kaito<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:10px\">\n                  <div style=\"flex:1;min-width:0;height:44px;border-radius:12px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:flex;align-items:center;padding:0 13px;font-size:15px;letter-spacing:2px;color:rgba(235,235,245,0.5)\">••••••••••••<\u002Fdiv>\n                  <button style=\"flex:none;height:44px;padding:0 15px;border-radius:12px;border:0;background:rgba(255,255,255,0.09);color:rgba(255,255,255,0.9);font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer\">Replace<\u002Fbutton>\n                <\u002Fdiv>\n                <button style=\"align-self:flex-start;padding:0;border:0;background:none;font-family:inherit;font-size:14.5px;font-weight:600;color:#F87966;cursor:pointer\">Remove token<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">FORMATS<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">Which publication formats appear in results.<\u002Fdiv>\n            <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);overflow:hidden;display:flex;flex-direction:column\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07)\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Manga<\u002Fdiv>\n                  <div style=\"margin-top:2px;font-size:13.5px;color:rgba(235,235,245,0.5)\">Japanese, right to left<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#F87966;padding:2px;display:flex;justify-content:flex-end\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07)\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Manhwa<\u002Fdiv>\n                  <div style=\"margin-top:2px;font-size:13.5px;color:rgba(235,235,245,0.5)\">Korean, usually vertical<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#F87966;padding:2px;display:flex;justify-content:flex-end\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07)\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Manhua<\u002Fdiv>\n                  <div style=\"margin-top:2px;font-size:13.5px;color:rgba(235,235,245,0.5)\">Chinese<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#2c2c2e;padding:2px;display:flex;justify-content:flex-start\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Novels<\u002Fdiv>\n                  <div style=\"margin-top:2px;font-size:13.5px;color:rgba(235,235,245,0.5)\">Prose, including light novels<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#2c2c2e;padding:2px;display:flex;justify-content:flex-start\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">Changing this clears downloaded feeds, because they were fetched under the previous setting.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">CONTENT<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">By default you see everything rated safe or suggestive. Turn these on to include stronger material in feeds, search and the stack.<\u002Fdiv>\n            <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);overflow:hidden;display:flex;flex-direction:column\">\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07)\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Safe<\u002Fdiv>\n                  <div style=\"margin-top:2px;font-size:13.5px;color:rgba(235,235,245,0.5)\">The baseline everyone sees<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;display:flex;align-items:center;gap:6px;height:31px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1)\">\n                  <svg width=\"11\" height=\"13\" viewBox=\"0 0 12 14\" fill=\"none\" stroke=\"rgba(235,235,245,0.7)\" stroke-width=\"1.5\"><rect x=\"1.4\" y=\"6\" width=\"9.2\" height=\"7\" rx=\"2\"><\u002Frect><path d=\"M3.6 6V4a2.4 2.4 0 0 1 4.8 0v2\"><\u002Fpath><\u002Fsvg>\n                  <span style=\"font-size:13px;font-weight:600;color:rgba(235,235,245,0.7)\">Always on<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07)\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Suggestive<\u002Fdiv>\n                  <div style=\"margin-top:2px;font-size:13.5px;color:rgba(235,235,245,0.5)\">Fan service, innuendo<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#F87966;padding:2px;display:flex;justify-content:flex-end\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:0.5px solid rgba(255,255,255,0.07)\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Erotica<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#2c2c2e;padding:2px;display:flex;justify-content:flex-start\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;padding:13px 14px\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.95)\">Explicit<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:none;width:51px;height:31px;border-radius:999px;background:#2c2c2e;padding:2px;display:flex;justify-content:flex-start\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;padding:11px 13px;border-radius:13px;background:rgba(248,121,102,0.09);border:0.5px solid rgba(248,121,102,0.22)\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.5\" style=\"flex:none;margin-top:1px\"><path d=\"M13.5 8a5.5 5.5 0 1 1-1.7-4\"><\u002Fpath><path d=\"M13.8 1.6v2.8H11\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <div style=\"font-size:13.5px;line-height:1.5;color:rgba(255,255,255,0.82);text-wrap:pretty\">Changing this refetches your feeds. Cached copies were fetched under the old filter, so they are discarded.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">BLOCKED TAGS<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">Hidden everywhere, whatever a series is rated. Unblock from the tag list in Browse.<\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n              <div style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 14px;border-radius:999px;background:#111114;border:0.5px solid rgba(255,255,255,0.1)\">\n                <span style=\"font-size:15px;color:rgba(255,255,255,0.9)\">Cooking<\u002Fspan>\n                <span style=\"width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,0.09);display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(235,235,245,0.65);line-height:1\">×<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 14px;border-radius:999px;background:#111114;border:0.5px solid rgba(255,255,255,0.1)\">\n                <span style=\"font-size:15px;color:rgba(255,255,255,0.9)\">Incest<\u002Fspan>\n                <span style=\"width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,0.09);display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(235,235,245,0.65);line-height:1\">×<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;background:transparent;border:0.5px dashed rgba(255,255,255,0.22)\">\n                <span style=\"font-size:15px;font-weight:600;color:#F87966;line-height:1\">+<\u002Fspan>\n                <span style=\"font-size:15px;color:rgba(235,235,245,0.62)\">Block a tag<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">RECENTLY VIEWED<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">The last 20 series you opened appear on Discover so you can get back to them. The list is stored on this phone, is never sent anywhere, and clearing it does not touch your library.<\u002Fdiv>\n            <button style=\"width:100%;height:52px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;font-family:inherit\">\n              <svg width=\"17\" height=\"17\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.6\"><path d=\"M2.6 9a6.4 6.4 0 1 0 2-4.6\"><\u002Fpath><path d=\"M2.2 2.6v3.4h3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M9 5.6V9l2.4 1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:16px;font-weight:700;color:#F87966\">Clear 2 series<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">DATA AND CREDIT<\u002Fdiv>\n            <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);padding:15px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:14.5px;line-height:1.55;color:rgba(235,235,245,0.75);text-wrap:pretty\">Series data comes from MangaBaka, and through it from AniList, Kitsu, MangaUpdates, MyAnimeList and Anime-Planet.<\u002Fdiv>\n              <a href=\"#credit\" style=\"display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700;color:#F87966\">mangabaka.org\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M4 10 10 4M5 4h5v5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fa>\n              <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n              <div style=\"font-size:13px;line-height:1.55;color:rgba(235,235,245,0.6);text-wrap:pretty\">Licensed CC BY-NC-SA 4.0 — free for personal, non-commercial use with attribution. This app is free and carries no ads or purchases.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:28px;width:393px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">B<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The four account states<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.58);text-wrap:pretty\">One card, four occupants. The status dot and its line carry the state; the field below never moves, so nothing jumps as a check completes.<\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08)\">\n\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">UNVERIFIED<\u002Fdiv>\n          <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);padding:14px;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"width:8px;height:8px;border-radius:999px;background:rgba(235,235,245,0.35);flex:none\"><\u002Fspan>\n              <span style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.95)\">Not checked yet<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.55);text-wrap:pretty\">Saved on this phone but never used. It is checked the first time something needs it.<\u002Fdiv>\n            <button style=\"align-self:flex-start;height:38px;padding:0 15px;border-radius:11px;border:0;background:rgba(255,255,255,0.09);color:rgba(255,255,255,0.9);font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer\">Check now<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">CHECKING<\u002Fdiv>\n          <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);padding:14px;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"width:8px;height:8px;border-radius:999px;background:#F87966;flex:none;animation:bmpulse 1.1s ease-in-out infinite\"><\u002Fspan>\n              <span style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.95)\">Checking…<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:3px;border-radius:2px;background:rgba(255,255,255,0.09);overflow:hidden\"><div style=\"width:38%;height:3px;border-radius:2px;background:#F87966\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.55);text-wrap:pretty\">The field and buttons stay put and stay usable — this is not a modal wait.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">VALID<\u002Fdiv>\n          <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);padding:14px;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"width:8px;height:8px;border-radius:999px;background:oklch(0.72 0.16 145);flex:none\"><\u002Fspan>\n              <span style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.95)\">Connected<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:14px;color:rgba(235,235,245,0.5)\">@kaito<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.55);text-wrap:pretty\">Library sync, recommendations and your taste profile are on.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">INVALID<\u002Fdiv>\n          <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(248,121,102,0.3);padding:14px;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;align-items:center;gap:9px\">\n              <span style=\"width:8px;height:8px;border-radius:999px;background:#F87966;flex:none\"><\u002Fspan>\n              <span style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.95)\">Token rejected<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">MangaBaka did not accept this token. Tokens are revoked when you regenerate one on the site. Discovery, search and the stack keep working without it.<\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n              <button style=\"height:38px;padding:0 15px;border-radius:11px;border:0;background:#F87966;color:#180B06;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer\">Paste a new one<\u002Fbutton>\n              <button style=\"height:38px;padding:0 15px;border-radius:11px;border:0.5px solid rgba(255,255,255,0.14);background:transparent;color:rgba(255,255,255,0.82);font-size:14.5px;font-weight:600;font-family:inherit;cursor:pointer\">Get a token ↗<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">C<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Blocked tags, empty<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">BLOCKED TAGS<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">Nothing is blocked. Add a tag here and it is hidden everywhere, whatever a series is rated.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;height:44px;padding:0 16px;border-radius:999px;border:0.5px dashed rgba(255,255,255,0.22);align-self:flex-start\">\n            <span style=\"font-size:16px;font-weight:600;color:#F87966;line-height:1\">+<\u002Fspan>\n            <span style=\"font-size:15px;color:rgba(235,235,245,0.72)\">Block a tag<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">An empty list is the normal state, so it reads as an invitation rather than a warning — no icon, no empty-state illustration.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">E<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Recently viewed, nothing to clear<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.58);text-wrap:pretty\">The button carries a live count, so it needs a zero. It stays in place and goes inert rather than disappearing — a control that vanishes makes the section look like it lost a feature.<\u002Fdiv>\n        <div style=\"padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:10px\">\n          <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">RECENTLY VIEWED<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">Nothing opened yet. The last 20 series you open appear on Discover so you can get back to them, stored on this phone and never sent anywhere.<\u002Fdiv>\n          <div style=\"width:100%;height:52px;border-radius:16px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;gap:9px\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 18 18\" fill=\"none\" stroke=\"rgba(235,235,245,0.35)\" stroke-width=\"1.6\"><path d=\"M2.6 9a6.4 6.4 0 1 0 2-4.6\"><\u002Fpath><path d=\"M2.2 2.6v3.4h3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M9 5.6V9l2.4 1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:16px;font-weight:600;color:rgba(235,235,245,0.6)\">Nothing to clear<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">D<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">One row at the largest accessibility size<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.58);text-wrap:pretty\">Above roughly 1.6× the row stops being a horizontal thing. Title, caption and switch stack; nothing has a fixed height; the switch keeps its 51×31 hit target.<\u002Fdiv>\n        <div style=\"padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:14px\">\n          <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);padding:16px;display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <div style=\"font-size:31px;font-weight:600;line-height:1.2;letter-spacing:-0.6px;color:rgba(255,255,255,0.95);text-wrap:pretty\">Suggestive<\u002Fdiv>\n              <div style=\"margin-top:7px;font-size:26px;line-height:1.3;color:rgba(235,235,245,0.55);text-wrap:pretty\">Fan service, innuendo<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"width:51px;height:31px;border-radius:999px;background:#F87966;padding:2px;display:flex;justify-content:flex-end\"><div style=\"width:27px;height:27px;border-radius:999px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,0.35)\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07);padding:16px;display:flex;flex-direction:column;gap:14px\">\n            <div>\n              <div style=\"font-size:31px;font-weight:600;line-height:1.2;letter-spacing:-0.6px;color:rgba(255,255,255,0.95);text-wrap:pretty\">Safe<\u002Fdiv>\n              <div style=\"margin-top:7px;font-size:26px;line-height:1.3;color:rgba(235,235,245,0.55);text-wrap:pretty\">The baseline everyone sees<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:8px;min-height:38px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);align-self:flex-start\">\n              <svg width=\"14\" height=\"16\" viewBox=\"0 0 12 14\" fill=\"none\" stroke=\"rgba(235,235,245,0.7)\" stroke-width=\"1.5\" style=\"flex:none\"><rect x=\"1.4\" y=\"6\" width=\"9.2\" height=\"7\" rx=\"2\"><\u002Frect><path d=\"M3.6 6V4a2.4 2.4 0 0 1 4.8 0v2\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:22px;font-weight:600;color:rgba(235,235,245,0.7)\">Always on<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.9);font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">NOTES<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px;border-radius:20px;background:#111114;border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:13px\">\n          <div>\n            <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">The locked row<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.65);text-wrap:pretty\">Safe has no switch at all rather than a dimmed one. A greyed switch reads as \"broken or not yours yet\"; a lock pill reads as a rule. The row title stays at full contrast — today the whole row is dimmed, which is what makes it look disabled.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Switches are drawn<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.65);text-wrap:pretty\">51×31 with a 27pt knob, matching the system metrics so the drawn control is indistinguishable. Nothing here asks for a real <span style=\"color:rgba(255,255,255,0.9)\">Toggle<\u002Fspan> — I am not spending your hour on the root cause.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Attribution, both obligations<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.65);text-wrap:pretty\">The licence link is a 16px accent link in its own section, not body text — findable in one scroll of a screen a reader already visits. The second obligation belongs on the series page's tracker row, where the third-party data actually is; that is a change to the detail screen, not this one, and I have not made it yet.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Refetch warning<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.65);text-wrap:pretty\">Content ratings get the tinted callout because the discard is immediate and total. Formats keep the plain grey line — same mechanism, smaller blast radius. Two weights for two sizes of consequence.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:1px;background:rgba(255,255,255,0.08);margin:0 44px\"><\u002Fdiv>\n\n<div id=\"brief-02\" style=\"scroll-margin-top:20px\"><\u002Fdiv>\n<section style=\"padding:44px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c;display:flex;flex-direction:column;gap:40px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:780px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">BRIEF 02 · EMPTY, ERROR, STALE, LOADING<\u002Fdiv>\n    <div style=\"font-size:38px;font-weight:700;letter-spacing:-1.3px;line-height:1.05;color:rgba(255,255,255,0.98)\">One layout, six causes — and the state nobody designed<\u002Fdiv>\n    <div style=\"font-size:14.5px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">The error family shares a skeleton: mark, headline, one line of cause, one action. What changes between them is the action, not the furniture. Stale-but-showing is the one that earns its own treatment, because it is not an error screen at all.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">A<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The layout, and its six occupants<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Full frame first, then the five other causes as the same block. Only the mark, the second line and the button change.<\u002Fdiv>\n\n      <div style=\"position:relative;width:393px;height:600px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;padding:28px\">\n        <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff\">11:34<\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:300px\">\n          <div style=\"width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"27\" height=\"27\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(255,255,255,0.85)\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M2 7.5a15 15 0 0 1 20 0\"><\u002Fpath><path d=\"M5.5 11.5a10 10 0 0 1 13 0\"><\u002Fpath><path d=\"M9 15.5a5 5 0 0 1 6 0\"><\u002Fpath><circle cx=\"12\" cy=\"19.5\" r=\"0.9\" fill=\"rgba(255,255,255,0.85)\"><\u002Fcircle><line x1=\"3\" y1=\"21\" x2=\"21\" y2=\"3\"><\u002Fline><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-size:24px;font-weight:700;letter-spacing:-0.6px;line-height:1.2;color:rgba(255,255,255,0.97)\">You're offline<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Showing what was downloaded. Nothing new can load until you're back.<\u002Fdiv>\n          <button style=\"margin-top:4px;height:46px;padding:0 22px;border-radius:14px;border:0;background:#F87966;color:#180B06;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer\">Try again<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px;padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08)\">\n        <div style=\"display:flex;gap:13px;padding:14px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n          <div style=\"flex:none;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"rgba(255,255,255,0.85)\" stroke-width=\"1.6\"><path d=\"M6 2.5h8M6 17.5h8\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M6.5 2.5v3.2L10 9l3.5-3.3V2.5M6.5 17.5v-3.2L10 11l3.5 3.3v3.2\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">Too many requests, briefly<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">MangaBaka is throttling this connection. The limit is shared by everyone on your network, so this may not be you at all. <span style=\"color:rgba(255,255,255,0.9)\">Retrying in 38s.<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:34px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,0.09);display:flex;align-items:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">Retry now<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:13px;padding:14px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n          <div style=\"flex:none;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"rgba(255,255,255,0.85)\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M10 2.6 18.4 17H1.6L10 2.6Z\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M10 7.6v4\"><\u002Fpath><circle cx=\"10\" cy=\"14.3\" r=\"0.85\" fill=\"rgba(255,255,255,0.85)\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">MangaBaka had a problem<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">Their server answered with an error. Nothing is wrong on this phone, and what you already have is still here.<\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:34px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,0.09);display:flex;align-items:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">Try again<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:13px;padding:14px;border-radius:16px;background:#111114;border:0.5px solid rgba(248,121,102,0.28)\">\n          <div style=\"flex:none;width:38px;height:38px;border-radius:12px;background:rgba(248,121,102,0.14);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.6\"><circle cx=\"8.2\" cy=\"6.6\" r=\"3.2\"><\u002Fcircle><path d=\"M2.6 16.4c0-3 2.5-4.6 5.6-4.6\" stroke-linecap=\"round\"><\u002Fpath><path d=\"M14.6 11.4v5.2M12 14h5.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">This part needs an account<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">Your library, recommendations and schedule are tied to a MangaBaka token. Discovery, search and the stack keep working without one.<\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:34px;padding:0 14px;border-radius:11px;background:#F87966;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:#180B06\">Open Settings<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:13px;padding:14px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n          <div style=\"flex:none;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"rgba(255,255,255,0.85)\" stroke-width=\"1.6\"><circle cx=\"10\" cy=\"10\" r=\"7.6\"><\u002Fcircle><path d=\"M7.9 7.7a2.2 2.2 0 1 1 3 2.1v1.4\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"10\" cy=\"14\" r=\"0.85\" fill=\"rgba(255,255,255,0.85)\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">Something went wrong<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">The answer wasn't in a shape this version understands. Cached copies were cleared, because they may no longer be accurate.<\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:34px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,0.09);display:flex;align-items:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">Try again<\u002Fspan>\n              <span style=\"height:34px;padding:0 14px;border-radius:11px;border:0.5px solid rgba(255,255,255,0.14);display:flex;align-items:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.82)\">Check for an update<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:13px;padding:14px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n          <div style=\"flex:none;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"rgba(255,255,255,0.85)\" stroke-width=\"1.6\"><circle cx=\"10\" cy=\"10\" r=\"7.6\"><\u002Fcircle><path d=\"M7.9 7.7a2.2 2.2 0 1 1 3 2.1v1.4\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"10\" cy=\"14\" r=\"0.85\" fill=\"rgba(255,255,255,0.85)\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"min-width:0\">\n            <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">Something went wrong<\u002Fdiv>\n            <div style=\"margin-top:4px;font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">The request didn't complete. Same words as a decode failure on purpose — a reader cannot act on the difference, and both drop what was cached.<\u002Fdiv>\n            <div style=\"margin-top:9px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:34px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,0.09);display:flex;align-items:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.88)\">Try again<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:28px;width:393px\">\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">B<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Stale but showing<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Good content, failed refresh. Not an error screen — the content stays the hero and a bar states its age. It sits under the title, scrolls away with the content, and returns on the next failed refresh.<\u002Fdiv>\n\n        <div style=\"position:relative;width:393px;height:560px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n          <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff;z-index:2\">11:34<\u002Fdiv>\n          <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a;z-index:2\"><\u002Fdiv>\n          <div style=\"padding:96px 18px 0\">\n            <div style=\"font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:rgba(255,255,255,0.97)\">Discover<\u002Fdiv>\n            <div style=\"margin-top:8px;font-size:13px;color:rgba(235,235,245,0.6)\">Thursday · 268 series cached<\u002Fdiv>\n\n            <div style=\"margin-top:16px;display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:15px;background:rgba(255,255,255,0.055);border:0.5px solid rgba(255,255,255,0.1)\">\n              <span style=\"flex:none;width:9px;height:9px;border-radius:999px;background:oklch(0.78 0.15 75)\"><\u002Fspan>\n              <div style=\"min-width:0;flex:1\">\n                <div style=\"font-size:14px;font-weight:600;color:rgba(255,255,255,0.92)\">Showing yesterday's<\u002Fdiv>\n                <div style=\"margin-top:2px;font-size:12.5px;color:rgba(235,235,245,0.65)\">Last updated 19 hours ago · refresh failed<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"flex:none;height:32px;padding:0 13px;border-radius:10px;background:rgba(255,255,255,0.1);display:flex;align-items:center;font-size:13px;font-weight:600;color:rgba(255,255,255,0.9)\">Retry<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:26px;font-size:27px;font-weight:700;letter-spacing:-0.9px;color:rgba(255,255,255,0.96)\">Rising this week<\u002Fdiv>\n            <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n              <div><div style=\"aspect-ratio:2/3;border-radius:13px;background:#17171c\"><\u002Fdiv><div style=\"margin-top:9px;height:11px;width:90%;border-radius:3px;background:rgba(255,255,255,0.14)\"><\u002Fdiv><div style=\"margin-top:6px;height:9px;width:60%;border-radius:3px;background:rgba(255,255,255,0.09)\"><\u002Fdiv><\u002Fdiv>\n              <div><div style=\"aspect-ratio:2/3;border-radius:13px;background:#17171c\"><\u002Fdiv><div style=\"margin-top:9px;height:11px;width:80%;border-radius:3px;background:rgba(255,255,255,0.14)\"><\u002Fdiv><div style=\"margin-top:6px;height:9px;width:55%;border-radius:3px;background:rgba(255,255,255,0.09)\"><\u002Fdiv><\u002Fdiv>\n              <div><div style=\"aspect-ratio:2/3;border-radius:13px;background:#17171c\"><\u002Fdiv><div style=\"margin-top:9px;height:11px;width:85%;border-radius:3px;background:rgba(255,255,255,0.14)\"><\u002Fdiv><div style=\"margin-top:6px;height:9px;width:50%;border-radius:3px;background:rgba(255,255,255,0.09)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Amber, not the accent. The accent means \"tap me\"; this bar is a fact with an optional action, and the app has no other amber, so it reads as a distinct register.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">C<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Four empties, four feelings<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Same skeleton as the errors, no mark. An invitation gets a filled button; a dead end gets a way out; a finished thing gets neither.<\u002Fdiv>\n\n        <div style=\"padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:14px\">\n          <div style=\"padding:18px 16px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">LIBRARY, NOTHING SAVED<\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:19px;font-weight:700;letter-spacing:-0.4px;color:rgba(255,255,255,0.96)\">Nothing saved yet<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:14px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">Swipe through the stack and anything you keep lands here, with a reading state and a rating.<\u002Fdiv>\n            <div style=\"margin-top:12px;height:42px;padding:0 18px;border-radius:13px;background:#F87966;display:inline-flex;align-items:center;font-size:14.5px;font-weight:700;color:#180B06\">Open the stack<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 16px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">STACK EXHAUSTED<\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:19px;font-weight:700;letter-spacing:-0.4px;color:rgba(255,255,255,0.96)\">That's today's stack<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:14px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">18 seen, 5 saved. A new one is dealt tomorrow morning.<\u002Fdiv>\n            <div style=\"margin-top:12px;height:42px;padding:0 18px;border-radius:13px;border:0.5px solid rgba(255,255,255,0.15);display:inline-flex;align-items:center;font-size:14.5px;font-weight:600;color:rgba(255,255,255,0.85)\">See what you saved<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 16px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">SEARCH, NO RESULTS<\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:19px;font-weight:700;letter-spacing:-0.4px;color:rgba(255,255,255,0.96)\">Nothing for \"vinlnad saga\"<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:14px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">A dead end should hand you a door. Two filters are narrowing this search.<\u002Fdiv>\n            <div style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:36px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,0.09);display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.9)\">Search \"vinland saga\" instead<\u002Fspan>\n              <span style=\"height:36px;padding:0 14px;border-radius:11px;border:0.5px solid rgba(255,255,255,0.14);display:flex;align-items:center;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.82)\">Clear filters<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 16px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">SEARCH, IDLE<\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:14px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">No headline at all — an idle field is not an empty state. Recent searches and saved lenses fill the space instead.<\u002Fdiv>\n            <div style=\"margin-top:11px;display:flex;gap:8px;flex-wrap:wrap\">\n              <span style=\"height:34px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;font-size:13.5px;color:rgba(235,235,245,0.78)\">murim<\u002Fspan>\n              <span style=\"height:34px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;font-size:13.5px;color:rgba(235,235,245,0.78)\">Completed manhwa 8+<\u002Fspan>\n              <span style=\"height:34px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;font-size:13.5px;color:rgba(235,235,245,0.78)\">regression<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">D<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">First load, and the next page<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:16px\">\n          <div>\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">FIRST LOAD OF A SCREEN<\u002Fdiv>\n            <div style=\"margin-top:11px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n              <div><div style=\"aspect-ratio:2/3;border-radius:13px;background:#17171c;animation:bmshimmer 1.6s ease-in-out infinite\"><\u002Fdiv><div style=\"margin-top:9px;height:11px;width:90%;border-radius:3px;background:rgba(255,255,255,0.1)\"><\u002Fdiv><\u002Fdiv>\n              <div><div style=\"aspect-ratio:2/3;border-radius:13px;background:#17171c;animation:bmshimmer 1.6s ease-in-out .2s infinite\"><\u002Fdiv><div style=\"margin-top:9px;height:11px;width:75%;border-radius:3px;background:rgba(255,255,255,0.1)\"><\u002Fdiv><\u002Fdiv>\n              <div><div style=\"aspect-ratio:2/3;border-radius:13px;background:#17171c;animation:bmshimmer 1.6s ease-in-out .4s infinite\"><\u002Fdiv><div style=\"margin-top:9px;height:11px;width:85%;border-radius:3px;background:rgba(255,255,255,0.1)\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Skeletons in the real grid, not a spinner — the layout does not jump when covers arrive, and BlurHash takes over per cover.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">PAGINATION<\u002Fdiv>\n            <div style=\"margin-top:11px;display:flex;align-items:center;justify-content:center;gap:10px;height:52px;border-radius:14px;background:rgba(255,255,255,0.04)\">\n              <span style=\"width:15px;height:15px;border-radius:999px;border:2px solid rgba(255,255,255,0.2);border-top-color:#F87966\"><\u002Fspan>\n              <span style=\"font-size:13.5px;font-weight:600;color:rgba(235,235,245,0.7)\">Loading 500 more<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top:10px;font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">A footer row, never a full-screen state — there is already content above it. It names the page size, because at 1,200 entries a reader deserves to know this takes three rounds.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:#111114;border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:13px\">\n        <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Decisions worth arguing
