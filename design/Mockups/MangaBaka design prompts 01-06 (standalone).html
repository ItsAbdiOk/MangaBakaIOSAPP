with<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Decode and transport share one wording. A reader cannot act on the difference, and two near-identical screens invite them to hunt for one.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Rate limiting states the shared-IP fact in the body rather than a tooltip. It is the only line in the family that defends the reader, and burying it wastes it.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">\"Needs an account\" is the only card with a filled accent button, because it is the only one where tapping fixes anything.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Schedule's empty state is not drawn here — it needs to explain that only reading, rereading and paused series get predictions, and that sentence needs your wording more than my layout.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:1px;background:rgba(255,255,255,0.08);margin:0 44px\"><\u002Fdiv>\n\n<div id=\"brief-03\" style=\"scroll-margin-top:20px\"><\u002Fdiv>\n<section style=\"padding:44px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c;display:flex;flex-direction:column;gap:40px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:780px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">BRIEF 03 · FIRST RUN<\u002Fdiv>\n    <div style=\"font-size:38px;font-weight:700;letter-spacing:-1.3px;line-height:1.05;color:rgba(255,255,255,0.98)\">Three screens, and the third is skippable<\u002Fdiv>\n    <div style=\"font-size:14.5px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">It is not a gate, so it should not behave like one. Screen one is the app working before anything is explained. Screen two is the one mechanic worth teaching. Screen three is the only ask, and it is refusable in one tap.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">1<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Covers first<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Real covers from the live rising feed, already loaded behind the copy. Nothing is promised that is not on screen.<\u002Fdiv>\n      <div style=\"position:relative;width:393px;height:760px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff;z-index:3\">11:34<\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a;z-index:3\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:0;height:430px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 14px;opacity:0.5\">\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c\"><img src=\"6a278e59-ddec-45b5-8e66-2167ab82157a\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c;margin-top:22px\"><img src=\"48bb497d-24f5-4281-8d5e-882a849086a7\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c\"><img src=\"117c3484-7ebd-4a3c-a579-37d4e25bb079\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c;margin-top:22px\"><img src=\"9d6822b5-49c1-47f4-80cf-d191dffac995\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c\"><img src=\"11a9695f-f1f0-49c6-9081-131b6a35f48b\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c;margin-top:22px\"><img src=\"61172e86-88b5-459d-bfd3-5090dcd98c74\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c\"><img src=\"0d988f1b-ba8d-4d70-af12-22a98ff8c864\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#17171c;margin-top:22px\"><img src=\"c00b84ed-718e-4876-97ce-ad46c3b9cd4f\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:210px;height:280px;background:linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 72%)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;padding:0 26px 40px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1.03;color:rgba(255,255,255,0.98);text-wrap:pretty\">Everything is already here<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:rgba(235,235,245,0.75);text-wrap:pretty\">Search, the daily stack and the blend work with no account and no sign-up. You can close this and start reading.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:2px\">\n            <span style=\"width:22px;height:6px;border-radius:999px;background:#F87966\"><\u002Fspan>\n            <span style=\"width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan>\n            <span style=\"width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan>\n            <span style=\"margin-left:auto;font-size:15px;font-weight:600;color:rgba(235,235,245,0.7)\">Skip<\u002Fspan>\n          <\u002Fdiv>\n          <button style=\"height:54px;border-radius:17px;border:0;background:#F87966;color:#180B06;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer\">Next<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">2<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The one mechanic<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The stack is the only thing in the app a reader cannot guess from looking. Everything else is a list and explains itself.<\u002Fdiv>\n      <div style=\"position:relative;width:393px;height:760px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff;z-index:3\">11:34<\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a;z-index:3\"><\u002Fdiv>\n\n        <div style=\"position:absolute;left:0;right:0;top:96px;height:330px;display:flex;align-items:center;justify-content:center\">\n          <div style=\"position:absolute;left:-40px;width:118px;aspect-ratio:2/3;border-radius:13px;overflow:hidden;opacity:0.28;filter:blur(1px)\"><img src=\"9d6822b5-49c1-47f4-80cf-d191dffac995\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"position:absolute;right:-40px;width:118px;aspect-ratio:2/3;border-radius:13px;overflow:hidden;opacity:0.28;filter:blur(1px)\"><img src=\"11a9695f-f1f0-49c6-9081-131b6a35f48b\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n          <div style=\"position:relative;width:196px;transform:rotate(-7deg) translateX(-14px)\">\n            <div style=\"aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:#131318;box-shadow:0 30px 60px rgba(0,0,0,0.7),0 0 0 0.5px rgba(255,255,255,0.12)\"><img src=\"6a278e59-ddec-45b5-8e66-2167ab82157a\" alt=\"Solo Leveling\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fdiv>\n            <span style=\"position:absolute;top:13px;left:13px;padding:6px 11px;border-radius:9px;font-size:11.5px;font-weight:700;letter-spacing:1px;background:rgba(10,10,12,0.72);color:rgba(255,255,255,0.85);border:0.5px solid rgba(255,255,255,0.2)\">SKIP<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:absolute;left:0;right:0;top:426px;display:flex;justify-content:center;gap:36px;padding:0 26px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;text-align:center\">\n            <div style=\"width:44px;height:44px;border-radius:999px;border:0.5px solid rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;font-size:19px;color:rgba(255,255,255,0.7)\">←<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.4;color:rgba(235,235,245,0.68)\">Left to pass<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;text-align:center\">\n            <div style=\"width:44px;height:44px;border-radius:999px;background:#F87966;display:flex;align-items:center;justify-content:center;font-size:19px;color:#180B06\">→<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.4;color:rgba(235,235,245,0.68)\">Right to keep<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:absolute;left:0;right:0;bottom:0;padding:0 26px 40px;display:flex;flex-direction:column;gap:16px\">\n          <div style=\"font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1.03;color:rgba(255,255,255,0.98);text-wrap:pretty\">A stack a day<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:rgba(235,235,245,0.75);text-wrap:pretty\">Series drawn from what is rising. Pass or keep, tap for the full page. It refills tomorrow, so there is nothing to catch up on.<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:2px\">\n            <span style=\"width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan>\n            <span style=\"width:22px;height:6px;border-radius:999px;background:#F87966\"><\u002Fspan>\n            <span style=\"width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan>\n            <span style=\"margin-left:auto;font-size:15px;font-weight:600;color:rgba(235,235,245,0.7)\">Skip<\u002Fspan>\n          <\u002Fdiv>\n          <button style=\"height:54px;border-radius:17px;border:0;background:#F87966;color:#180B06;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer\">Next<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">3<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The only ask<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Three named things an account adds, and the refusal is a full-width button rather than grey text. \"Not now\" ends onboarding for good — it does not reappear.<\u002Fdiv>\n      <div style=\"position:relative;width:393px;height:760px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff;z-index:3\">11:34<\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a;z-index:3\"><\u002Fdiv>\n\n        <div style=\"position:absolute;left:0;right:0;top:110px;padding:0 26px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1.03;color:rgba(255,255,255,0.98);text-wrap:pretty\">An account adds your own data<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:rgba(235,235,245,0.75);text-wrap:pretty\">Nothing you have seen so far needs one. These three do.<\u002Fdiv>\n\n          <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:11px\">\n            <div style=\"display:flex;gap:13px;padding:15px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n              <div style=\"flex:none;width:36px;height:36px;border-radius:11px;background:rgba(248,121,102,0.14);display:flex;align-items:center;justify-content:center\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.7\"><rect x=\"2.6\" y=\"3\" width=\"4.2\" height=\"14\" rx=\"1.5\"><\u002Frect><rect x=\"8.6\" y=\"6\" width=\"3.8\" height=\"11\" rx=\"1.5\"><\u002Frect><rect x=\"14.2\" y=\"3\" width=\"3.2\" height=\"14\" rx=\"1.5\"><\u002Frect><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">A library that follows you<\u002Fdiv>\n                <div style=\"margin-top:3px;font-size:14px;line-height:1.45;color:rgba(235,235,245,0.68);text-wrap:pretty\">Reading states, ratings and progress, synced across devices.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:13px;padding:15px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n              <div style=\"flex:none;width:36px;height:36px;border-radius:11px;background:rgba(248,121,102,0.14);display:flex;align-items:center;justify-content:center\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.7\"><circle cx=\"7.6\" cy=\"10\" r=\"5\"><\u002Fcircle><circle cx=\"12.4\" cy=\"10\" r=\"5\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">Recommendations from your taste<\u002Fdiv>\n                <div style=\"margin-top:3px;font-size:14px;line-height:1.45;color:rgba(235,235,245,0.68);text-wrap:pretty\">The stack and the blend weight toward what you have rated.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:13px;padding:15px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n              <div style=\"flex:none;width:36px;height:36px;border-radius:11px;background:rgba(248,121,102,0.14);display:flex;align-items:center;justify-content:center\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.7\"><rect x=\"2.8\" y=\"4\" width=\"14.4\" height=\"13\" rx=\"2.6\"><\u002Frect><path d=\"M2.8 8h14.4M6.6 2.6v2.8M13.4 2.6v2.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:16px;font-weight:700;color:rgba(255,255,255,0.95)\">A schedule for what you read<\u002Fdiv>\n                <div style=\"margin-top:3px;font-size:14px;line-height:1.45;color:rgba(235,235,245,0.68);text-wrap:pretty\">Predicted releases for series you are reading or have paused.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:absolute;left:0;right:0;bottom:0;padding:0 26px 40px;display:flex;flex-direction:column;gap:11px\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\">\n            <span style=\"width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan>\n            <span style=\"width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan>\n            <span style=\"width:22px;height:6px;border-radius:999px;background:#F87966\"><\u002Fspan>\n          <\u002Fdiv>\n          <button style=\"height:54px;border-radius:17px;border:0;background:#F87966;color:#180B06;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer\">Connect an account<\u002Fbutton>\n          <button style=\"height:54px;border-radius:17px;border:0.5px solid rgba(255,255,255,0.16);background:transparent;color:rgba(255,255,255,0.88);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer\">Not now<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.9);font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">NOTES<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:18px;border-radius:20px;background:#111114;border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:13px\">\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Why three and not four<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">The brief allows four. Search, the library and the schedule are all lists a reader recognises on sight, so a screen explaining them would be teaching what is already obvious. The stack is the exception and gets the screen.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Skip is visible from screen one<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">If it genuinely is not a gate, the exit should be on the first screen, not discovered on the third. It sits on the dot row so it never competes with the primary button.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Handoff to Settings<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">\"Connect an account\" opens Settings scrolled to the account card with the field focused. Dropping a reader at the top of Settings after they said yes is the version that loses them.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Needs your call<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Screen one shows live covers from the rising feed. On a cold first launch with no network that grid is empty — either it falls back to a shipped set of covers, or screen one becomes type-only. I would ship the fallback set.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:1px;background:rgba(255,255,255,0.08);margin:0 44px\"><\u002Fdiv>\n\n<div id=\"brief-04\" style=\"scroll-margin-top:20px\"><\u002Fdiv>\n<section style=\"padding:44px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c;display:flex;flex-direction:column;gap:40px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:780px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">BRIEF 04 · LIBRARY<\u002Fdiv>\n    <div style=\"font-size:38px;font-weight:700;letter-spacing:-1.3px;line-height:1.05;color:rgba(255,255,255,0.98)\">A thousand series, one you want<\u002Fdiv>\n    <div style=\"font-size:14.5px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">The screen a reader opens most after a month, and the one with no mockup. Three answers to finding one entry: a filter that states the shape, a search field pinned above the list, and a jump index down the edge. All three are cheap; none needs data the app lacks.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">A<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The list, loaded<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Search and the state filter are pinned; the bar under them is the shape of the library, and each band is the filter for that state.<\u002Fdiv>\n\n      <div style=\"position:relative;width:393px;height:852px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff;z-index:3\">11:34<\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a;z-index:3\"><\u002Fdiv>\n\n        <div style=\"padding:92px 18px 0\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n            <div style=\"min-width:0\">\n              <div style=\"font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:rgba(255,255,255,0.97)\">Library<\u002Fdiv>\n              <div style=\"margin-top:6px;font-size:13.5px;color:rgba(235,235,245,0.62);font-variant-numeric:tabular-nums\">1,204 series · 512 rated<\u002Fdiv>\n            < e=\"margin-top:10px;display:flex;gap:5px;font-size:24px;letter-spacing:2px;color:#F87966\">★★★★<span style=\"color:rgba(255,255,255,0.18)\">★<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1\">\n                <div style=\"font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">CHAPTER<\u002Fdiv>\n                <div style=\"margin-top:8px;display:flex;align-items:center;gap:9px\">\n                  <span style=\"width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:17px;color:rgba(255,255,255,0.8)\">−<\u002Fspan>\n                  <span style=\"font-size:19px;font-weight:700;color:rgba(255,255,255,0.95);font-variant-numeric:tabular-nums\">112<\u002Fspan>\n                  <span style=\"width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:17px;color:rgba(255,255,255,0.8)\">+<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <button style=\"margin-top:22px;width:100%;height:50px;border-radius:16px;border:0;background:#F87966;color:#180B06;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer\">Save<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;align-items:center;gap:9px\">\n          <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">C<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Empty, and still loading<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 18px;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:16px\">\n          <div style=\"padding:18px 16px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">EMPTY LIBRARY<\u002Fdiv>\n            <div style=\"margin-top:9px;font-size:19px;font-weight:700;letter-spacing:-0.4px;color:rgba(255,255,255,0.96)\">Nothing saved yet<\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:14px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">Swipe through the stack and anything you keep lands here, with a reading state and a rating. No search field, no filter, no shape bar — they arrive with the first entry.<\u002Fdiv>\n            <div style=\"margin-top:12px;height:42px;padding:0 18px;border-radius:13px;background:#F87966;display:inline-flex;align-items:center;font-size:14.5px;font-weight:700;color:#180B06\">Open the stack<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:18px 16px;border-radius:16px;background:#111114;border:0.5px solid rgba(255,255,255,0.07)\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">PAGE 1 OF 3 LOADED<\u002Fdiv>\n            <div style=\"margin-top:10px;display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,0.05)\">\n              <span style=\"width:15px;height:15px;border-radius:999px;border:2px solid rgba(255,255,255,0.2);border-top-color:#F87966;flex:none\"><\u002Fspan>\n              <div style=\"min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;color:rgba(255,255,255,0.9)\">500 of 1,204 loaded<\u002Fdiv>\n                <div style=\"margin-top:2px;font-size:12.5px;line-height:1.45;color:rgba(235,235,245,0.65);text-wrap:pretty\">Counts and search cover what has arrived so far.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:9px\">\n              <div style=\"display:flex;gap:12px;align-items:center\"><div style=\"flex:none;width:44px;aspect-ratio:2/3;border-radius:7px;background:#17171c;animation:bmshimmer 1.6s ease-in-out infinite\"><\u002Fdiv><div style=\"flex:1\"><div style=\"height:12px;width:70%;border-radius:3px;background:rgba(255,255,255,0.11)\"><\u002Fdiv><div style=\"margin-top:7px;height:10px;width:40%;border-radius:3px;background:rgba(255,255,255,0.07)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;gap:12px;align-items:center\"><div style=\"flex:none;width:44px;aspect-ratio:2/3;border-radius:7px;background:#17171c;animation:bmshimmer 1.6s ease-in-out .2s infinite\"><\u002Fdiv><div style=\"flex:1\"><div style=\"height:12px;width:55%;border-radius:3px;background:rgba(255,255,255,0.11)\"><\u002Fdiv><div style=\"margin-top:7px;height:10px;width:32%;border-radius:3px;background:rgba(255,255,255,0.07)\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;font-size:13px;line-height:1.5;color:rgba(235,235,245,0.62);text-wrap:pretty\">The count says \"of 1,204\" from the first page, so the number never grows in front of the reader — and nothing offers \"Add to library\" for a series that may be on page three.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:#111114;border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:13px\">\n        <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Finding one among a thousand<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\"><span style=\"color:rgba(255,255,255,0.9)\">Search, pinned.<\u002Fspan> Local, over titles and alternative titles. It filters what has loaded and says so while pages are still arriving. This is the answer to question 8 — it is a field, not a screen.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\"><span style=\"color:rgba(255,255,255,0.9)\">The shape bar.<\u002Fspan> Five states, proportional, tappable. It answers \"how much of this is finished\" without a single number, and doubles as the filter a reader actually wants.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\"><span style=\"color:rgba(255,255,255,0.9)\">The jump index.<\u002Fspan> Only when sorted by title, only above ~200 entries. Free to build, and the one thing that makes a 1,200-row list feel finite.<\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\"><span style=\"color:rgba(255,255,255,0.9)\">Sorting.<\u002Fspan> Recently updated by default, with title, rating and date added behind the header control. Grouping by state is deliberately absent — the filter already does that, and two mechanisms for one job is how they drift.<\u002Fdiv>\n        <div style=\"font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\"><span style=\"color:rgba(255,255,255,0.9)\">Dropped.<\u002Fspan> In the filter, last, and never in the default list. It is the one state a reader wants counted but not shown.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:1px;background:rgba(255,255,255,0.08);margin:0 44px\"><\u002Fdiv>\n\n<div id=\"brief-05\" style=\"scroll-margin-top:20px\"><\u002Fdiv>\n<section style=\"padding:44px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c;display:flex;flex-direction:column;gap:40px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:800px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">BRIEF 05 · LENSES AND THE TAG FILTER<\u002Fdiv>\n    <div style=\"font-size:38px;font-weight:700;letter-spacing:-1.3px;line-height:1.05;color:rgba(255,255,255,0.98)\">Saving a search, and picking from 146 tags<\u002Fdiv>\n    <div style=\"font-size:14.5px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">Four questions were open. My answers: saving happens wherever filters do, from one control; the name is generated and editable; lenses live at the top of Search, above the field's idle state; and a lens whose filters the API drops says so on its face rather than failing silently.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">A<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Save, from the filter sheet<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">One control, in the sheet that owns filters — so it appears in Search and in Mix without being designed twice. It only becomes active once something is actually set.<\u002Fdiv>\n\n      <div style=\"position:relative;width:393px;height:600px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;inset:0;background:rgba(0,0,0,0.5)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;border-radius:26px 26px 0 0;background:#16161c;border-top:0.5px solid rgba(255,255,255,0.14);padding:10px 18px 26px\">\n          <div style=\"text-align:center\"><span style=\"display:inline-block;width:38px;height:5px;border-radius:999px;background:rgba(255,255,255,0.25)\"><\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:12px;display:flex;align-items:center;justify-content:space-between\">\n            <div style=\"font-size:22px;font-weight:700;letter-spacing:-0.6px;color:rgba(255,255,255,0.97)\">Filters<\u002Fdiv>\n            <span style=\"font-size:14px;font-weight:600;color:#F87966\">Reset<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">TYPE<\u002Fdiv>\n          <div style=\"margin-top:10px;display:flex;gap:7px;flex-wrap:wrap\">\n            <span style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;font-size:13.5px;color:rgba(235,235,245,0.78)\">Any<\u002Fspan>\n            <span style=\"height:34px;padding:0 14px;border-radius:999px;background:#F87966;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:#180B06\">Manhwa<\u002Fspan>\n            <span style=\"height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;font-size:13.5px;color:rgba(235,235,245,0.78)\">Manga<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">TAGS<\u002Fdiv>\n          <div style=\"margin-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center\">\n            <span style=\"height:34px;padding:0 8px 0 13px;border-radius:999px;background:rgba(248,121,102,0.16);border:0.5px solid rgba(248,121,102,0.35);display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#F87966\">Regression <span style=\"opacity:0.7\">×<\u002Fspan><\u002Fspan>\n            <span style=\"height:34px;padding:0 8px 0 13px;border-radius:999px;background:rgba(248,121,102,0.16);border:0.5px solid rgba(248,121,102,0.35);display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#F87966\">Murim <span style=\"opacity:0.7\">×<\u002Fspan><\u002Fspan>\n            <span style=\"height:34px;padding:0 13px;border-radius:999px;border:0.5px dashed rgba(255,255,255,0.22);display:flex;align-items:center;font-size:13.5px;color:rgba(235,235,245,0.7)\">+ Add tags<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;font-size:12px;font-weight:600;letter-spacing:0.9px;color:rgba(235,235,245,0.6)\">MINIMUM RATING<\u002Fdiv>\n          <div style=\"margin-top:12px;display:flex;align-items:center;gap:12px\">\n            <div style=\"flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);position:relative\"><div style=\"width:64%;height:4px;border-radius:2px;background:#F87966\"><\u002Fdiv><div style=\"position:absolute;left:64%;top:-8px;width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.5)\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:15px;font-weight:700;color:rgba(255,255,255,0.95);font-variant-numeric:tabular-nums\">8.0<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:24px;display:flex;gap:10px\">\n            <button style=\"flex:none;width:52px;height:52px;border-radius:16px;border:0.5px solid rgba(248,121,102,0.4);background:rgba(248,121,102,0.12);display:flex;align-items:center;justify-content:center;cursor:pointer\">\n              <svg width=\"20\" height=\"20\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"1.8\"><path d=\"M5 3h12v16l-6-4.2L5 19V3Z\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <button style=\"flex:1;height:52px;border-radius:16px;border:0;background:#F87966;color:#180B06;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer\">Show 148 results<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"margin-top:9px;font-size:12.5px;line-height:1.45;color:rgba(235,235,245,0.62);text-align:center;text-wrap:pretty\">The bookmark saves this as a lens. Greyed until a filter is set.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">B<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Naming: generated, then editable<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The field arrives pre-filled from the filters and selected, so Save is one tap and renaming is one keystroke. A reader who must invent a name before seeing value usually abandons.<\u002Fdiv>\n\n      <div style=\"position:relative;width:393px;height:600px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;inset:0;background:rgba(0,0,0,0.62)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:22px;right:22px;top:180px;border-radius:24px;background:#1a1a20;border:0.5px solid rgba(255,255,255,0.12);padding:22px 20px\">\n          <div style=\"font-size:21px;font-weight:700;letter-spacing:-0.5px;color:rgba(255,255,255,0.97)\">Save as a lens<\u002Fdiv>\n          <div style=\"margin-top:7px;font-size:14px;line-height:1.5;color:rgba(235,235,245,0.68);text-wrap:pretty\">Lenses sit at the top of Search. This one reruns live — it stores the filters, not the results.<\u002Fdiv>\n\n          <div style=\"margin-top:18px;height:48px;border-radius:13px;background:rgba(255,255,255,0.07);border:1px solid #F87966;display:flex;align-items:center;padding:0 13px\">\n            <span style=\"font-size:16px;color:rgba(255,255,255,0.96);background:rgba(248,121,102,0.28);padding:1px 3px;border-radius:3px\">Manhwa · Regression · 8.0+<\u002Fspan>\n            <span style=\"width:1.5px;height:20px;background:#F87966;margin-left:1px\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:9px;font-size:12.5px;line-height:1.45;color:rgba(235,235,245,0.62);text-wrap:pretty\">Generated from the filters. Selected, so typing replaces it.<\u002Fdiv>\n\n          <div style=\"margin-top:16px;padding:12px 13px;border-radius:13px;background:rgba(255,255,255,0.045);border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.7px;color:rgba(235,235,245,0.6)\">WHAT IT STORES<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;color:rgba(235,235,245,0.72)\">Type manhwa · tags Regression, Murim · rating 8.0+ · sort trending<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:20px;display:flex;gap:10px\">\n            <button style=\"flex:1;height:48px;border-radius:14px;border:0.5px solid rgba(255,255,255,0.16);background:transparent;color:rgba(255,255,255,0.85);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer\">Cancel<\u002Fbutton>\n            <button style=\"flex:1;height:48px;border-radius:14px;border:0;background:#F87966;color:#180B06;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer\">Save lens<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">C<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">Where lenses live<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The idle state of Search — the screen a reader is already on when they want one. Yours first, presets below, edit on long press.<\u002Fdiv>\n\n      <div style=\"position:relative;width:393px;height:700px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 40px 90px rgba(0,0,0,0.75),0 0 0 1px rgba(255,255,255,0.08)\">\n        <div style=\"position:absolute;left:26px;top:14px;font-size:15px;font-weight:600;color:#fff;z-index:3\">11:34<\u002Fdiv>\n        <div style=\"position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:31px;border-radius:999px;background:#0a0a0a;z-index:3\"><\u002Fdiv>\n        <div style=\"padding:92px 18px 0\">\n          <div style=\"font-size:36px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:rgba(255,255,255,0.97)\">Search<\u002Fdiv>\n          <div style=\"margin-top:14px;display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;border-radius:13px;background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.08)\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"rgba(235,235,245,0.6)\" stroke-width=\"2\"><circle cx=\"9.6\" cy=\"9.6\" r=\"6.4\"><\u002Fcircle><line x1=\"14.6\" y1=\"14.6\" x2=\"19\" y2=\"19\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>\n            <span style=\"font-size:15px;color:rgba(235,235,245,0.6)\">Title, tag, publisher, staff<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:26px;display:flex;align-items:baseline;justify-content:space-between\">\n            <div style=\"font-size:20px;font-weight:700;letter-spacing:-0.5px;color:rgb  style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:13.5px;color:rgba(235,235,245,0.62)\">1 · 22<\u002Fspan><span style=\"font-size:14px;color:rgba(235,235,245,0.5)\">⌄<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 2px\"><span style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.94)\">Themes<\u002Fspan><span style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:13.5px;color:rgba(235,235,245,0.62)\">41<\u002Fspan><span style=\"font-size:14px;color:rgba(235,235,245,0.5)\">⌄<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 2px\"><span style=\"font-size:16px;font-weight:600;color:rgba(255,255,255,0.94)\">Cast<\u002Fspan><span style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:13.5px;color:rgba(235,235,245,0.62)\">17<\u002Fspan><span style=\"font-size:14px;color:rgba(235,235,245,0.5)\">⌄<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px;width:393px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.9);font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">NOTES<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:18px;border-radius:20px;background:#111114;border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:13px\">\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Where saving happens<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">In the filter sheet, which both Search and Mix already present. One control, one place to maintain. Saving from a results screen would need a second entry point that drifts from the first.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">A lens stores filters, not results<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">The count next to each lens is live, so it moves. That is the point — a lens is a question, and the answer changes.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">When a filter stops existing<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">The lens keeps working with the surviving filters and says which one it dropped, in amber. It does not silently return different results, and it does not refuse to run — a saved search that breaks on the API's schedule should degrade, not die.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Weight as a bar<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Core, defining, recurrent and incidental are four words a reader will not learn. A four-step bar carries the same ordering, sorts the list, and needs no legend.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Per-search blocking, not drawn<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Agreed with your call. There is no second blocked-tags switch anywhere in these frames. If you want it later it is a feature with its own states, not a toggle in a sheet.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Needs your call<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Lens counts require a count query per lens on Search's idle state. If that is too many requests, the counts come off and the rows carry their filter summary instead.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:1px;background:rgba(255,255,255,0.08);margin:0 44px\"><\u002Fdiv>\n\n<div id=\"brief-06\" style=\"scroll-margin-top:20px\"><\u002Fdiv>\n<section style=\"padding:44px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:#0a0a0c;display:flex;flex-direction:column;gap:40px\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:800px\">\n    <div style=\"font-size:11px;font-weight:600;letter-spacing:0.8px;color:rgba(235,235,245,0.6)\">BRIEF 06 · APP ICON<\u002Fdiv>\n    <div style=\"font-size:38px;font-weight:700;letter-spacing:-1.3px;line-height:1.05;color:rgba(255,255,255,0.98)\">Three marks, no books<\u002Fdiv>\n    <div style=\"font-size:14.5px;line-height:1.6;color:rgba(235,235,245,0.72);text-wrap:pretty\">Each is built from circles and rounded rectangles only, so it holds at 40px and survives the tinted variant, where colour carries nothing. Shown at 1024, 120, 60 and 40, then light, dark and tinted, then on a home screen.<\u002Fdiv>\n    <div style=\"margin-top:4px;padding:14px 16px;border-radius:14px;background:rgba(248,121,102,0.1);border:0.5px solid rgba(248,121,102,0.28);font-size:13.5px;line-height:1.55;color:rgba(255,255,255,0.85);text-wrap:pretty\">These are geometry sketches, not finished artwork — I cannot generate images. They are drawn in vector shapes so the one you pick can be handed to a designer or rebuilt at 1024 directly. Judge the idea and the silhouette, not the craft.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start\">\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;width:400px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">1<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The fan — three cards, offset<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The stack is the app's one original mechanic. Cards, not pages: square corners at the bottom would read as paper, so all four are radiused.<\u002Fdiv>\n\n      <div style=\"width:240px;height:240px;border-radius:54px;background:#151519;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,0.6)\">\n        <svg width=\"150\" height=\"150\" viewBox=\"0 0 100 100\">\n          <rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#5a3630\" transform=\"rotate(-16 45 52)\"><\u002Frect>\n          <rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a45747\" transform=\"rotate(-7 51 50)\"><\u002Frect>\n          <rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#F87966\"><\u002Frect>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px\">\n        <div style=\"width:120px;height:120px;border-radius:27px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"75\" height=\"75\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#5a3630\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a45747\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#F87966\"><\u002Frect><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"width:60px;height:60px;border-radius:13px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"38\" height=\"38\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#5a3630\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a45747\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#F87966\"><\u002Frect><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"width:40px;height:40px;border-radius:9px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"25\" height=\"25\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#5a3630\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a45747\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#F87966\"><\u002Frect><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">At 40px the two rear cards collapse into a shoulder. Still legible, but this is the concept that loses the most.<\u002Fdiv>\n\n      <div style=\"display:flex;gap:12px;margin-top:4px\">\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#F4F2EF;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#e8b3a6\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#f09a86\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#D9503A\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Light<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#151519;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#5a3630\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a45747\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#F87966\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Dark<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#2b2b2e;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#6e6e70\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a8a8aa\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#fff\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Tinted<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Tinted works because the three cards differ in luminance, not hue. That separation is designed in, not inherited from the colour.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;width:400px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">2<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The blend — two circles<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Already the app's Mix glyph, so the icon and the tab agree. Two things overlapping is what the whole product does: it finds the shared middle.<\u002Fdiv>\n\n      <div style=\"width:240px;height:240px;border-radius:54px;background:#151519;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,0.6)\">\n        <svg width=\"150\" height=\"150\" viewBox=\"0 0 100 100\">\n          <circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle>\n          <circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle>\n          <path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#ffd9d0\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px\">\n        <div style=\"width:120px;height:120px;border-radius:27px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"75\" height=\"75\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#ffd9d0\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"width:60px;height:60px;border-radius:13px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"38\" height=\"38\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#ffd9d0\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"width:40px;height:40px;border-radius:9px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"25\" height=\"25\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#ffd9d0\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The strongest of the three at 40px — one silhouette, one bright centre, nothing to lose.<\u002Fdiv>\n\n      <div style=\"display:flex;gap:12px;margin-top:4px\">\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#F4F2EF;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#D9503A\" opacity=\"0.8\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#D9503A\" opacity=\"0.8\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#7d2013\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Light<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#151519;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#ffd9d0\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Dark<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#2b2b2e;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#8e8e90\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#8e8e90\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#fff\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Tinted<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The overlap is a lighter value in every variant, so the venn reads even when the whole mark is one channel.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;width:400px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">3<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">The eye — ring and pupil<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">The Discover glyph, promoted. Discovery is the app's first tab and its whole argument. A ring is also the shape most robust to scaling of anything here.<\u002Fdiv>\n\n      <div style=\"width:240px;height:240px;border-radius:54px;background:#151519;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,0.6)\">\n        <svg width=\"150\" height=\"150\" viewBox=\"0 0 100 100\">\n          <circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"9\"><\u002Fcircle>\n          <circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#F87966\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-end;gap:16px\">\n        <div style=\"width:120px;height:120px;border-radius:27px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"75\" height=\"75\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#F87966\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"width:60px;height:60px;border-radius:13px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"38\" height=\"38\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#F87966\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"width:40px;height:40px;border-radius:9px;background:#151519;display:flex;align-items:center;justify-content:center\">\n          <svg width=\"25\" height=\"25\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#F87966\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Scales perfectly and says the least. A ring and a dot belongs to a hundred apps — this is the safe one, and safe is its whole problem.<\u002Fdiv>\n\n      <div style=\"display:flex;gap:12px;margin-top:4px\">\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#F4F2EF;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#D9503A\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#D9503A\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Light<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#151519;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#F87966\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Dark<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;align-items:center\">\n          <div style=\"width:96px;height:96px;border-radius:22px;background:#2b2b2e;display:flex;align-items:center;justify-content:center\"><svg width=\"62\" height=\"62\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#fff\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:11.5px;color:rgba(235,235,245,0.6)\">Tinted<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px;width:400px\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"height:22px;padding:0 9px;border-radius:999px;background:#F87966;color:#180B06;font-size:11px;font-weight:700;letter-spacing:0.6px;display:flex;align-items:center\">4<\u002Fdiv>\n        <div style=\"font-size:15px;font-weight:600;color:rgba(255,255,255,0.98)\">On a home screen<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.5;color:rgba(235,235,245,0.6);text-wrap:pretty\">Dark wallpaper, dark neighbours — the case the brief warns about. All three carry a light mark on a near-black tile, so none of them disappears.<\u002Fdiv>\n\n      <div style=\"width:393px;padding:34px 26px;border-radius:38px;background:linear-gradient(160deg,#241d28 0%,#10131c 55%,#0a0a0f 100%);border:1px solid rgba(255,255,255,0.08)\">\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px 18px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#151519;display:flex;align-items:center;justify-content:center\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 100 100\"><rect x=\"24\" y=\"24\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#5a3630\" transform=\"rotate(-16 45 52)\"><\u002Frect><rect x=\"30\" y=\"22\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#a45747\" transform=\"rotate(-7 51 50)\"><\u002Frect><rect x=\"36\" y=\"20\" width=\"42\" height=\"56\" rx=\"9\" fill=\"#F87966\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">MangaBaka<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#151519;display:flex;align-items:center;justify-content:center\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 100 100\"><circle cx=\"38\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><circle cx=\"62\" cy=\"50\" r=\"26\" fill=\"#F87966\" opacity=\"0.75\"><\u002Fcircle><path d=\"M50 27.5a26 26 0 0 0 0 45 26 26 0 0 0 0-45Z\" fill=\"#ffd9d0\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">MangaBaka<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#151519;display:flex;align-items:center;justify-content:center\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"#F87966\" stroke-width=\"9\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#F87966\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">MangaBaka<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#1c7cf0;display:flex;align-items:center;justify-content:center\"><svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M4 5.5h16v13H4z\" opacity=\"0.25\"><\u002Fpath><path d=\"M4 5.5 12 13l8-7.5\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">Mail<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#2c2c2e;display:flex;align-items:center;justify-content:center\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3.2 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">Clock<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#111114;display:flex;align-items:center;justify-content:center\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(255,255,255,0.85)\" stroke-width=\"1.8\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"4\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">Photos<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#34c759;display:flex;align-items:center;justify-content:center\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M6.5 3.5 19 12 6.5 20.5V3.5Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">Play<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n            <div style=\"width:62px;height:62px;border-radius:14px;background:#1c1c1e;display:flex;align-items:center;justify-content:center\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.8\"><path d=\"M4 7h16M4 12h16M4 17h10\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <span style=\"font-size:11px;color:rgba(255,255,255,0.9)\">Notes<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:18px;border-radius:20px;background:#111114;border:0.5px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:13px\">\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">Which one I would ship<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">The blend. It is the only one that is both distinctive and unhurt at 40px, it already exists as a tab glyph so the app and the icon agree, and its tinted variant needs no rework — the overlap is a value, not a colour. The fan tells a better story but pays for it at Spotlight size; the eye scales best and says least.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">No wordmark<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">BAKAMANGA is nine letters. At 40px it is a grey smear, and the label under the icon already says the name.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:0.5px;background:rgba(255,255,255,0.08)\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:14px;font-weight:700;color:rgba(255,255,255,0.95)\">What is missing<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:13.5px;line-height:1.55;color:rgba(235,235,245,0.68);text-wrap:pretty\">Real 1024×1024 exports. Pick one and I can produce clean vector geometry at size with the exact fills for each variant, but the finished icon should have a designer's hand on the optical centring and the corner radii.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:1px;background:rgba(255,255,255,0.08);margin:0 44px\"><\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
